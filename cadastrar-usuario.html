<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuario</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container-reservas">
        <div class="ctn-menu">
            <h1>Hotel Pet</h1>

            <div class="menu">
                <ul>
                    <li>
                        <a href="pets.html">
                            <img src="imagens/pet.png" alt="">
                            Pet
                        </a>
                    </li>
                    <li>
                        <a href="usuarios.html">
                            <img src="imagens/usuarios.png" alt="">
                            Usuários
                        </a>
                    </li>
                    <li>
                        <a href="configuracoes.html">
                            <img src="imagens/configurações.png" alt="">
                            Configurações
                        </a>
                    </li>
                    <li>
                        <a href="reservas.html">
                            <img src="imagens/reservas.png" alt="">
                            Reservas
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="ctn-conteudo-pagina">

            <div class="perfil-usuario">
                <a href="editar-perfil.html">
                    <img src="imagens/gerente.png" alt="" height="40px">
                    <p>João da Silva</p>
                </a>
            </div>

            <div class="area-trabalho">
                <p class="caminho">Home / Usuário / Cadastrar Usuário</p>

                <div class="container-secao">
                    <div class="caixa-titulo">
                        <h2>Cadastrar Usuário</h2>
                    </div>

                    <div class="container-filtro">
                        <div class="form-editar-perfil">

                            <div class="campo-filtro">
                                <label for="cadastro-usuario-email">E-mail</label>
                                <input type="email" required id="cadastro-usuario-email">
                            </div>

                            <div class="campo-filtro">
                                <label for="cadastro-usuario-nome">Nome</label>
                                <input type="text" required id="cadastro-usuario-nome">
                            </div>

                            <div class="campo-filtro">
                                <label for="cadastro-usuario-sobrenome">Sobrenome</label>
                                <input type="text" required id="cadastro-usuario-sobrenome">
                            </div>

                            <div class="campo-filtro">
                                <label for="cadastro-usuario-telefone">Telefone</label>
                                <input type="text" required id="cadastro-usuario-telefone">
                            </div>

                            <div class="campo-filtro">
                                <label for="cadastro-usuario-funcao">Função</label>
                                <select id="cadastro-usuario-funcao">
                                    <option value="Cliente">Cliente</option>
                                    <option value="Funcionário">Funcionário</option>
                                    <option value="Gerente">Gerente</option>
                                </select>
                            </div>

                            <div class="foto-perfil">
                                <div class="campo-filtro">
                                    <label for="cadastro-usuario-imagem">Imagem</label>
                                    <input type="file" id="cadastro-usuario-imagem" accept=".jpg, .jpeg, .png, .webp">
                                </div>
                            </div>

                            <div class="caixa-botoes">
                                <!-- É fundamental o type="button" para não recarregar a página -->
                                <button type="button" id="btn-salvar-novo-usuario" class="botao-azul">Salvar</button>
                                <button type="button" class="botao-branco-laranja">Limpar</button>
                            </div>

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
