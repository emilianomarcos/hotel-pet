<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuario</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container-reservas">
        <div class="ctn-menu">
            <h1>Hotel Pet</h1>

            <div class="menu">
                <ul>
                    <li>
                        <a href="pets.html">
                            <img src="imagens/pet.png" alt="">
                            Pet
                        </a>
                    </li>
                    <li>
                        <a href="usuarios.html">
                            <img src="imagens/usuarios.png" alt="">
                            Usuários
                        </a>
                    </li>
                    <li>
                        <a href="configuracoes.html">
                            <img src="imagens/configurações.png" alt="">
                            Configurações
                        </a>
                    </li>
                    <li>
                        <a href="reservas.html">
                            <img src="imagens/reservas.png" alt="">
                            Reservas
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="ctn-conteudo-pagina">

            <div class="perfil-usuario">
                <a href="editar-perfil.html">
                    <img src="imagens/gerente.png" alt="" height="40px">
                    <p>João da Silva</p>
                </a>
            </div>

            <div class="area-trabalho">
                <p class="caminho">Home / Usuário / Cadastrar Usuário</p>

                <div class="container-secao">
                    <div class="caixa-titulo">
                        <h2>Cadastrar Usuário</h2>
                    </div>

                    <div class="container-filtro">

                        <div class="form-editar-perfil">

                            <div class="campo-filtro">
                                <label for="">E-mail</label>
                                <input type="text" required name="" id="">
                            </div>

                            <div class="campo-filtro">
                                <label for="">Nome</label>
                                <input type="text" required name="" id="">
                            </div>
                            
                            <div class="campo-filtro">
                                <label for="">Sobrenome</label>
                                <input type="text" required name="" id="">
                            </div>
                            
                            <div class="campo-filtro">
                                <label for="">Telefone</label>
                                <input type="text" required name="" id="">
                            </div>

                            <div class="campo-filtro">
                                <label for="">Função</label>
                                <select name="" id="">
                                    <option value=""></option>
                                    <option value="funcionario">Funcionário</option>
                                    <option value="cliente">Cliente</option>
                                    <option value="gerente">Gerente</option>
                                </select>
                            </div>

                            <div class="foto-perfil">
                                <div class="campo-filtro">
                                    <label for="">Imagem</label>
                                    <input type="file" accept=".jpg, .jpeg, .png, .webp" src="" alt="">
                                </div>
                            </div>

                            <div class="caixa-botoes">
                                <button class="botao-azul">Salvar</button>
                                <button class="botao-branco-laranja">Limpar</button>
                            </div>

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
