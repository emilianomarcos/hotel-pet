<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Usuário</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container-reservas">
        <div class="ctn-menu">
            <h1>Hotel Pet</h1>

            <div class="menu">
                <ul>
                    <li>
                        <a href="pets.html">
                            <img src="imagens/pet.png" alt="">
                            Pet
                        </a>
                    </li>
                    <li>
                        <a href="usuarios.html">
                            <img src="imagens/usuarios.png" alt="">
                            Usuários
                        </a>
                    </li>
                    <li>
                        <a href="configuracoes.html">
                            <img src="imagens/configurações.png" alt="">
                            Configurações
                        </a>
                    </li>
                    <li>
                        <a href="reservas.html">
                            <img src="imagens/reservas.png" alt="">
                            Reservas
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="ctn-conteudo-pagina">

            <div class="perfil-usuario">
                <a href="editar-perfil.html">
                    <img src="imagens/gerente.png" alt="" height="40px">
                    <p>João da Silva</p>
                </a>
            </div>

            <div class="area-trabalho">
                <p class="caminho">Home / Visualizar Usuário</p>

                <div class="container-secao">
                    <div class="caixa-titulo">
                        <h2>Visualizar Usuário</h2>
                    </div>

                    <div class="container-filtro">
                        <div class="form-editar-perfil">

                            <div class="campo-filtro">
                                <label for="vis-usuario-email">E-mail</label>
                                <input type="text" readonly id="vis-usuario-email" style="background-color: #f0f0f0;">
                            </div>

                            <div class="campo-filtro">
                                <label for="vis-usuario-nome">Nome</label>
                                <input type="text" readonly id="vis-usuario-nome" style="background-color: #f0f0f0;">
                            </div>

                            <div class="campo-filtro">
                                <label for="vis-usuario-sobrenome">Sobrenome</label>
                                <input type="text" readonly id="vis-usuario-sobrenome"
                                    style="background-color: #f0f0f0;">
                            </div>

                            <div class="campo-filtro">
                                <label for="vis-usuario-telefone">Telefone</label>
                                <input type="text" readonly id="vis-usuario-telefone"
                                    style="background-color: #f0f0f0;">
                            </div>

                            <div class="campo-filtro">
                                <label for="vis-usuario-funcao">Função</label>
                                <select id="vis-usuario-funcao" disabled style="background-color: #f0f0f0;">
                                    <option value="Cliente">Cliente</option>
                                    <option value="Funcionário">Funcionário</option>
                                    <option value="Gerente">Gerente</option>
                                </select>
                            </div>

                            <div class="foto-perfil">
                                <div class="campo-filtro">
                                    <label>Imagem</label>
                                    <!-- Trocamos o input file por uma tag de imagem para mostrar a foto atual -->
                                    <img id="vis-usuario-imagem" src="imagens/Avatar.png" alt="Foto do Usuário"
                                        height="100px" style="border-radius: 8px; margin-top: 10px;">
                                </div>
                            </div>

                            <div class="caixa-botoes">
                                <button type="button" class="botao-branco-laranja"
                                    onclick="window.location.href='usuarios.html'">Voltar</button>
                            </div>

                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>


    <script src="js/script.js"></script>
</body>

</html>
