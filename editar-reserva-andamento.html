<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reserva em Andamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-reservas">
        <div class="ctn-menu">
            <h1>Hotel Pet</h1>

            <div class="menu">
                <ul>
                    <li>
                        <a href="pets.html">
                            <img src="imagens/pet.png" alt="">
                            Pet
                        </a>
                    </li>
                    <li>
                        <a href="usuarios.html">
                            <img src="imagens/usuarios.png" alt="">
                            Usuários
                        </a>
                    </li>
                    <li>
                        <a href="configuracoes.html">
                            <img src="imagens/configurações.png" alt="">
                            Configurações
                        </a>
                    </li>
                    <li>
                        <a href="reservas.html">
                            <img src="imagens/reservas.png" alt="">
                            Reservas
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="ctn-conteudo-pagina">

            <div class="perfil-usuario">
                <a href="editar-perfil.html">
                    <img src="imagens/gerente.png" alt="" height="40px">
                    <p>João da Silva</p>
                </a>
            </div>

            <div class="area-trabalho">
                <p class="caminho">Home / Reservas / Editar Reserva</p>

                <div class="container-secao">
                    <div class="caixa-titulo">
                        <h2>Editar Reserva</h2>
                    </div>

                    <div class="container-filtro">

                        <div class="form-editar-reserva">

                            <div class="campo-filtro">
                                <label for="">Proprietário</label>
                                <input type="text" name="" id="">
                            </div>

                            <div class="campo-filtro">
                                <label for="">Pet</label>
                                <input type="text" name="" id="">
                            </div>
                            
                            <div class="campo-filtro">
                                <label for="">Período</label>
                                <div class="periodo">
                                    <input type="date" name="" id="">
                                    <input type="date" name="" id="">
                                </div>
                            </div>

                            <div class="campo-filtro">
                                <label for="">Notas</label>
                                <textarea name="" id="" rows="5"></textarea>
                            </div>

                            <div class="campo-filtro">
                                <label for="">Status</label>
                                <select name="" id="">
                                    <option value=""></option>
                                    <option value="reservada">Reservada</option>
                                    <option value="em-progresso">Em progresso</option>
                                    <option value="finalizada">Finalizada</option>
                                </select>
                            </div>

                            <div class="campo-filtro">
                                <label for="">Anotações do funcionário</label>
                                <textarea name="" id="" rows="5"></textarea>
                            </div>

                            <div class="imagens-reserva-andamento">
                                <img src="imagens/cachorro.jpg" alt="" height="100px">
                                <img src="imagens/nova-imagem.png" alt="" height="100px">
                            </div>
                            <div class="total">
                                <p>Total das diárias: <span>R$ 40,00</span></p>
                            </div>

                            <div class="caixa-botoes">
                                <button class="botao-azul">Salvar</button>
                                <button class="botao-branco-laranja">Limpar</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
