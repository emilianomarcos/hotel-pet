<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reserva</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container-reservas">
        <div class="ctn-menu">
            <h1>Hotel Pet</h1>

            <div class="menu">
                <ul>
                    <li>
                        <a href="pets.html">
                            <img src="imagens/pet.png" alt="">
                            Pet
                        </a>
                    </li>
                    <li>
                        <a href="usuarios.html">
                            <img src="imagens/usuarios.png" alt="">
                            Usuários
                        </a>
                    </li>
                    <li>
                        <a href="configuracoes.html">
                            <img src="imagens/configurações.png" alt="">
                            Configurações
                        </a>
                    </li>
                    <li>
                        <a href="reservas.html">
                            <img src="imagens/reservas.png" alt="">
                            Reservas
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="ctn-conteudo-pagina">

            <div class="perfil-usuario">
                <a href="editar-perfil.html">
                    <img src="imagens/gerente.png" alt="" height="40px">
                    <p>João da Silva</p>
                </a>
            </div>

            <div class="area-trabalho">
                <p class="caminho">Home / Reservas / Editar Reserva</p>

                <div class="container-secao">
                    <div class="caixa-titulo">
                        <h2>Editar Reserva</h2>
                    </div>

                    <div class="container-filtro">

                        <div class="form-editar-reserva">

                            <div class="campo-filtro">
                                <label for="editar-reserva-dono">Proprietário</label>
                                <input type="text" id="editar-reserva-dono" readonly style="background-color: #f0f0f0;">
                            </div>

                            <div class="campo-filtro">
                                <label for="editar-reserva-pet">Pet</label>
                                <input type="text" id="editar-reserva-pet" readonly style="background-color: #f0f0f0;">
                            </div>

                            <div class="campo-filtro">
                                <label for="editar-reserva-chegada">Período</label>
                                <div class="periodo">
                                    <input type="date" id="editar-reserva-chegada">
                                    <input type="date" id="editar-reserva-partida">
                                </div>
                            </div>

                            <div class="campo-filtro">
                                <label for="editar-reserva-notas">Notas Iniciais</label>
                                <textarea id="editar-reserva-notas" rows="3"></textarea>
                            </div>

                            <div class="campo-filtro">
                                <label for="editar-reserva-status">Status</label>
                                <select id="editar-reserva-status">
                                    <option value="Reservado">Reservado</option>
                                    <option value="Em progresso">Em progresso</option>
                                    <option value="Finalizado">Finalizado</option>
                                </select>
                            </div>

                            <!-- BLOCO DINÂMICO: EM ANDAMENTO (Oculto por padrão) -->
                            <div id="bloco-andamento" style="display: none;">
                                <div class="campo-filtro">
                                    <label for="editar-reserva-anotacoes-func">Anotações do funcionário</label>
                                    <textarea id="editar-reserva-anotacoes-func" rows="3"></textarea>
                                </div>
                                <div class="imagens-reserva-andamento">
                                    <img src="imagens/cachorro.jpg" alt="" height="100px">
                                    <img src="imagens/nova-imagem.png" alt="" height="100px">
                                </div>
                            </div>

                            <!-- BLOCO DINÂMICO: FINALIZADA (Oculto por padrão) -->
                            <div id="bloco-finalizada" style="display: none;">
                                <div class="nota-fiscal">
                                    <a href="#" class="link-roxo">Adicionar Nota Fiscal</a>
                                </div>
                                <div class="recibo">
                                    <img src="imagens/icone-anexo.png" alt="">
                                    <a href="#">recibo.pdf</a>
                                </div>
                            </div>

                            <div class="total">
                                <p>Total das diárias: <span id="editar-reserva-total-texto">R$ 0,00</span></p>
                            </div>

                            <div class="caixa-botoes">
                                <button type="button" id="btn-salvar-edicao-reserva" class="botao-azul">Salvar</button>
                                <button type="button" class="botao-branco-laranja" id="btn-voltar-edicao-reserva">Voltar</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>


    <script src="js/script.js"></script>
</body>

</html>
