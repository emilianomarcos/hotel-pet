<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Pet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-reservas">
        <div class="ctn-menu">
            <h1>Hotel Pet</h1>

            <div class="menu">
                <ul>
                    <li>
                        <a href="pets.html">
                            <img src="imagens/pet.png" alt="">
                            Pet
                        </a>
                    </li>
                    <li>
                        <a href="usuarios.html">
                            <img src="imagens/usuarios.png" alt="">
                            Usuários
                        </a>
                    </li>
                    <li>
                        <a href="configuracoes.html">
                            <img src="imagens/configurações.png" alt="">
                            Configurações
                        </a>
                    </li>
                    <li>
                        <a href="reservas.html">
                            <img src="imagens/reservas.png" alt="">
                            Reservas
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="ctn-conteudo-pagina">

            <div class="perfil-usuario">
                <a href="editar-perfil.html">
                    <img src="imagens/gerente.png" alt="" height="40px">
                    <p>João da Silva</p>
                </a>
            </div>

            <div class="area-trabalho">
                <p class="caminho">Home / Pet / Novo Pet</p>

                <div class="container-secao">
                    <div class="caixa-titulo">
                        <h2>Novo Pet</h2>
                    </div>

                    <div class="container-filtro">

                        <div class="container-form-novo-pet">

                            <div class="form-novo-pet">
    
                                <div class="campo-filtro">
                                    <label for="">Proprietário</label>
                                    <input type="text" required name="" id="">
                                </div>
    
                                <div class="campo-filtro">
                                    <label for="">Nome</label>
                                    <input type="text" required name="" id="">
                                </div>
                                
                                <div class="campo-filtro">
                                    <label for="">Tipo</label>
                                    <select name="" id="">
                                        <option value=""></option>
                                        <option value="cachorro">Cachorro</option>
                                        <option value="gato">Gato</option>
                                    </select>
                                </div>
                                
                                <div class="campo-filtro">
                                    <label for="">Raça</label>
                                    <input type="text" required name="" id="">
                                </div>
    
                                <div class="campo-filtro">
                                    <label for="">Tamanho</label>
                                    <select name="" id="">
                                        <option value=""></option>
                                        <option value="pequene">Pequeno</option>
                                        <option value="medio">Medio</option>
                                        <option value="grande">Grande</option>
                                    </select>
                                </div>
    
                                <div class="caixa-botoes">
                                    <button class="botao-azul">Salvar</button>
                                    <button class="botao-branco-laranja">Limpar</button>
                                </div>
    
                            </div>
                            
                            <div class="foto-pet-cadastro">
                                <label for="">Imagem</label>
                                <input type="file" accept=".jpg, .jpeg, .png, .webp" src="" alt="">
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
